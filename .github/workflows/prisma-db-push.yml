name: Prisma DB Push (Init)

on:
  workflow_dispatch:

jobs:
  db_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prisma db push (create/update tables)
      - name: Debug DATABASE_URL prefix (safe)

        run: |

          node -e "const u=process.env.DATABASE_URL||""; console.log("DATABASE_URL prefix:", u.slice(0, 12)); console.log("Has postgresql://", u.startsWith("postgresql://"));"

        env:

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
