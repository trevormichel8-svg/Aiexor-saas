name: Prisma DB Push (Init)

on:
  workflow_dispatch:

jobs:
  db_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Debug DATABASE_URL prefix (safe)
        run: |
          node -e "const u=process.env.DATABASE_URL||''; console.log('Has postgresql://', u.startsWith('postgresql://')); console.log('Prefix:', u.slice(0, 12));"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prisma db push (create/update tables)
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
